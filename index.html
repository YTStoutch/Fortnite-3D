<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Fortnite 3D Prototype</title>
  <style>
    body { margin: 0; overflow: hidden; background: #87ceeb; }
    #loadingBarContainer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 300px;
      height: 25px;
      background: #444;
      border-radius: 5px;
    }
    #loadingBar {
      width: 0%;
      height: 100%;
      background: #0f0;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div id="loadingBarContainer">
    <div id="loadingBar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // Scene, Camera, Renderer
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0,5,10);

    const renderer = new THREE.WebGLRenderer({antialias: true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);

    // Lumière
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
    directionalLight.position.set(10,20,10);
    scene.add(directionalLight);

    // Sol
    const groundGeometry = new THREE.PlaneGeometry(50,50);
    const groundMaterial = new THREE.MeshStandardMaterial({color: 0x228B22});
    const ground = new THREE.Mesh(groundGeometry, groundMaterial);
    ground.rotation.x = -Math.PI/2;
    scene.add(ground);

    // Bâtiments simples
    function createBuilding(x, z) {
      const geometry = new THREE.BoxGeometry(2,5,2);
      const material = new THREE.MeshStandardMaterial({color: 0x8B4513});
      const building = new THREE.Mesh(geometry, material);
      building.position.set(x,2.5,z);
      scene.add(building);
    }
    createBuilding(5,5);
    createBuilding(-5,5);
    createBuilding(-5,-5);
    createBuilding(5,-5);

    // Loot (cube simple)
    function createLoot(x, z) {
      const geometry = new THREE.BoxGeometry(0.5,0.5,0.5);
      const material = new THREE.MeshStandardMaterial({color: 0xffff00});
      const loot = new THREE.Mesh(geometry, material);
      loot.position.set(x,0.25,z);
      scene.add(loot);
    }
    createLoot(0,0);
    createLoot(2,2);
    createLoot(-2,-2);

    // Chargement du modèle
    const loadingBar = document.getElementById('loadingBar');
    const manager = new THREE.LoadingManager();

    manager.onProgress = function(url, loaded, total){
      const progress = (loaded / total) * 100;
      loadingBar.style.width = progress + '%';
    };

    manager.onLoad = function(){
      document.getElementById('loadingBarContainer').style.display = 'none';
    };

    const loader = new THREE.GLTFLoader(manager);
    loader.load('https://threejs.org/examples/models/gltf/Flamingo.glb', function(gltf){
      const model = gltf.scene;
      model.scale.set(0.01,0.01,0.01);
      model.position.set(0,0,0);
      scene.add(model);
    });

    // Animation
    function animate(){
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
      controls.update();
    }
    animate();

    window.addEventListener('resize', ()=>{
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
