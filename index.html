<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Fortnite 3D Prototype</title>
<style>
body,html{margin:0;padding:0;overflow:hidden;background:#000;color:white;font-family:Arial}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;font-size:2rem;z-index:10}
#progress-container{width:300px;height:20px;border:2px solid white;margin-top:10px;}
#progress-bar{width:0%;height:100%;background:#00ff00;}
#hud{position:fixed;top:0;left:0;width:100%;padding:10px;z-index:5;pointer-events:none;font-size:20px}
#inv{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
.slot{width:60px;height:60px;border:2px solid white;display:flex;align-items:center;justify-content:center;background:#111}
</style>
</head>
<body>
<div id="loading">
  <div style="text-align:center;">
    Chargement...
    <div id="progress-container">
      <div id="progress-bar"></div>
    </div>
  </div>
</div>

<div id="hud">HP: <span id="hp">100</span></div>
<div id="inv">
  <div class="slot" id="slot1">Pistolet</div>
  <div class="slot" id="slot2">Fusil</div>
  <div class="slot" id="slot3">Potion</div>
</div>
<canvas id="game"></canvas>

<script type="module">
import * as THREE from './libs/three.module.js';
import { GLTFLoader } from './libs/GLTFLoader.js';

// ====== INITIALISATION ======
const canvas = document.getElementById("game");
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,1.7,5);

// ====== SKYBOX SIMPLE (placeholder) ======
scene.background = new THREE.Color(0x87ceeb); // ciel bleu simple, tu peux remplacer par une vraie skybox

// ====== LUMIERE ======
const ambient = new THREE.AmbientLight(0xffffff,0.5);
scene.add(ambient);
const directional = new THREE.DirectionalLight(0xffffff,1);
directional.position.set(10,10,10);
scene.add(directional);

// ====== SOL ======
const geo = new THREE.PlaneGeometry(500,500);
const mat = new THREE.MeshStandardMaterial({color:0x228822});
const sol = new THREE.Mesh(geo,mat);
sol.rotation.x = -Math.PI/2;
scene.add(sol);

// ====== LOADING MANAGER ======
const loadingManager = new THREE.LoadingManager();
loadingManager.onStart = (url, loaded, total) => console.log(`Début du chargement: ${url}`);
loadingManager.onProgress = (url, loaded, total) => {
  const progress = (loaded / total) * 100;
  document.getElementById("progress-bar").style.width = progress + "%";
};
loadingManager.onLoad = () => {
  console.log('Tous les assets chargés !');
  document.getElementById("loading").style.display = "none";
};

// ====== CHARGEMENT DU PERSONNAGE ======
const loader = new GLTFLoader(loadingManager);
loader.load('assets/character.glb', gltf => {
  const model = gltf.scene;
  model.position.set(0,0,0);
  scene.add(model);
}, undefined, error => console.error('Erreur modèle:', error));

// ====== BÂTIMENTS / LOOT ======
const buildingGeo = new THREE.BoxGeometry(1,2,1);
const buildingMat = new THREE.MeshStandardMaterial({color:0x8888ff});
for(let i=0;i<5;i++){
  const building = new THREE.Mesh(buildingGeo,buildingMat);
  building.position.set(Math.random()*20-10,1,Math.random()*20-10);
  scene.add(building);
}

const lootGeo = new THREE.BoxGeometry(0.5,0.5,0.5);
const lootMat = new THREE.MeshStandardMaterial({color:0xffcc00});
for(let i=0;i<5;i++){
  const loot = new THREE.Mesh(lootGeo,lootMat);
  loot.position.set(Math.random()*20-10,0.25,Math.random()*20-10);
  scene.add(loot);
}

// ====== CONTROLES ======
let vitesse = 0.2;
const keys = {};
document.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

// ====== ANIMATION ======
function animate(){
  requestAnimationFrame(animate);
  if(keys["z"]) camera.position.z -= vitesse;
  if(keys["s"]) camera.position.z += vitesse;
  if(keys["q"]) camera.position.x -= vitesse;
  if(keys["d"]) camera.position.x += vitesse;
  renderer.render(scene,camera);
}
animate();

// ====== REDIMENSION ======
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
