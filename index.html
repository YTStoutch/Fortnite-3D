<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Fortnite 3D Prototype</title>
  <style>
    body,html{margin:0;padding:0;overflow:hidden;background:#000;color:white;font-family:Arial}
    #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;font-size:2rem;z-index:10}
    #hud{position:fixed;top:0;left:0;width:100%;padding:10px;z-index:5;pointer-events:none;font-size:20px}
    #inv{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
    .slot{width:60px;height:60px;border:2px solid white;display:flex;align-items:center;justify-content:center;background:#111}
  </style>
</head>
<body>
  <div id="loading">Chargement...</div>
  <div id="hud">HP: <span id="hp">100</span></div>
  <div id="inv"></div>
  <canvas id="game"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>

  <script>
    // ====== INITIALISATION ======
    const canvas = document.getElementById("game");
    const renderer = new THREE.WebGLRenderer({ canvas });
    renderer.setSize(window.innerWidth, window.innerHeight);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
    camera.position.set(0,1.7,5);

    // ====== LUMIERE ======
    const light = new THREE.DirectionalLight(0xffffff,1);
    light.position.set(10,10,10);
    scene.add(light);

    // ====== SOL ======
    const geo = new THREE.PlaneGeometry(500,500);
    const mat = new THREE.MeshStandardMaterial({color:0x228822});
    const sol = new THREE.Mesh(geo,mat);
    sol.rotation.x = -Math.PI/2;
    scene.add(sol);

    // ====== JOUEUR ======
    let vitesse = 0.1;
    const keys = {};
    document.addEventListener("keydown", e => keys[e.key] = true);
    document.addEventListener("keyup", e => keys[e.key] = false);

    // ====== ANIMATION ======
    function anime(){
      requestAnimationFrame(anime);

      // Mouvement simple
      if(keys["z"]) camera.position.z -= vitesse;
      if(keys["s"]) camera.position.z += vitesse;
      if(keys["q"]) camera.position.x -= vitesse;
      if(keys["d"]) camera.position.x += vitesse;

      renderer.render(scene,camera);
    }

    // Retire l'écran de chargement
    document.getElementById("loading").style.display = "none";
    anime();
  </script>
</body>
</html>
